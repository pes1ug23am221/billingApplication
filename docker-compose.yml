version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: grocery_billing
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_user -d grocery_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  model_service:
    build:
      context: ./model_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - media_files:/app/media   # shared with web — reads same uploaded images
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn grocery_billing.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120
               --access-logfile -"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - MODEL_SERVICE_URL=http://model_service:8001
    volumes:
      - .:/app
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      model_service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:
